global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: "production"
    project: "inventory-api"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: "inventory-api"
    static_configs:
      - targets:
          - "inventory-api:3000"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    sample_limit: 5000

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "node-exporter:9100"
    scrape_interval: 15s
    scrape_timeout: 10s
    
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "cadvisor:8080"
    scrape_interval: 15s
    scrape_timeout: 10s